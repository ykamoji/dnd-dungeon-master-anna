name: Build Executa

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Tests, UI and manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Versions match app.json
        run: python scripts/stamp_version.py --check
      - name: Executa protocol and campaign flow
        run: python -m unittest discover -s tests -v
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit
      - name: Build UI bundle
        run: npm run build --prefix ui
      - name: Bundle size, paths and CSP hashes
        run: python scripts/check_bundle.py
      - name: Validate app manifest
        run: |
          npm install -g @anna-ai/cli
          anna-app validate --strict

  build:
    if: github.event_name != 'pull_request'
    needs: checks
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check protocol and campaign flow
        run: python -m unittest discover -s tests -v
      - name: Build Executa binary
        run: python scripts/build_executa.py
      - name: Package platform archive
        run: python scripts/package_executa.py --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: executas/dnd-game-master/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executa-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
